name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'favoris/**'
      - 'wallet-unlock/**'
      - '.github/workflows/deploy-favoris.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            favoris/package-lock.json
            wallet-unlock/package-lock.json

      - name: Install favoris dependencies
        run: npm ci
        working-directory: favoris

      - name: Build favoris
        run: npm run build
        working-directory: favoris

      - name: Install wallet-unlock dependencies
        run: npm ci
        working-directory: wallet-unlock

      - name: Build wallet-unlock
        run: npm run build
        working-directory: wallet-unlock

      - name: Assemble site
        run: |
          mkdir -p _site
          # Copier les fichiers statiques à la racine (html, images, etc.)
          # sauf les dossiers de projets buildés
          find . -maxdepth 1 \
            -not -name '.' \
            -not -name '_site' \
            -not -name '.git' \
            -not -name '.github' \
            -not -name 'favoris' \
            -not -name 'wallet-unlock' \
            -exec cp -r {} _site/ \;
          # Build favoris (Next.js static export)
          cp -r favoris/out _site/favoris
          # Build wallet-unlock (Vite) → basePath /prototypes/2026-09-deblocage-wallet/
          cp -r wallet-unlock/dist _site/2026-09-deblocage-wallet

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
